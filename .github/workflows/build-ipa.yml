name: Build Unsigned IPA for Sideloadly
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Web App and Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies and Build Web Assets
        run: |
          npm install
          npm run build 

      - name: Initialize Capacitor iOS Container
        run: |
          # Install development dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          
          # Initialize configuration files safely 
          npx cap init "PuzzleForge Hub" "com.sideload.puzzleforge" --web-dir=dist --confirm
          
          # Use the CLI to scaffold structural configurations while forcing CocoaPods to skip execution
          npx cap add ios --no-sync || true
          
          # Overwrite the newly created Podfile immediately with our forced iOS 14 configuration
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '14.0'
          use_frameworks!

          # Set up framework dependencies manually
          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end
          EOF

          # Copy compiled web assets manually over to the public workspace bundle
          npx cap copy ios
          
          # Manually trigger CocoaPods with the updated deployment targets
          cd ios/App
          pod install

      - name: Compile Native App Bundle (Unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App into IPA Container
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PuzzleForge_Unsigned.ipa Payload
          
      - name: Upload Finished File to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleForge-Sideloadly-Ready
          path: PuzzleForge_Unsigned.ipa
