name: Build Unsigned IPA for Sideloadly
on:
  workflow_dispatch:

jobs:
  build:
    name: Build Web App and Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies and Build Web Assets
        run: |
          npm install
          npm run build 

      - name: Initialize Capacitor iOS Container
        run: |
          # Install development dependencies
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          
          # Initialize configuration files non-interactively via direct arguments
          npx cap init "PuzzleForge Hub" "com.sideload.puzzleforge" --web-dir=dist
          
          # Create a dummy 'pod' command in the runner path to skip automatic pod install during add
          mkdir -p bin
          echo '#!/bin/bash' > bin/pod
          echo 'echo "Mocking pod install to bypass target check..."' >> bin/pod
          chmod +x bin/pod
          export PATH="$PWD/bin:$PATH"
          
          # Run add ios safely (it will use our dummy pod command instead of crashing)
          npx cap add ios
          
          # Overwrite the Podfile completely with a forced global iOS 14 configuration
          cat << 'EOF' > ios/App/Podfile
          platform :ios, '14.0'
          use_frameworks!

          def capacitor_pods
            pod 'Capacitor', :path => '../../node_modules/@capacitor/ios'
            pod 'CapacitorCordova', :path => '../../node_modules/@capacitor/ios'
          end

          target 'App' do
            capacitor_pods
          end
          EOF

          # Copy compiled web assets over to the native public assets folder
          npx cap copy ios
          
          # Remove the dummy pod script so we can trigger the genuine CocoaPods engine manually
          rm bin/pod
          
          # Run the real pod install with our corrected deployment rules
          cd ios/App
          pod install

      - name: Compile Native App Bundle (Unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            IPHONEOS_DEPLOYMENT_TARGET=14.0 \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App into IPA Container
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r PuzzleForge_Unsigned.ipa Payload
          
      - name: Upload Finished File to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleForge-Sideloadly-Ready
          path: PuzzleForge_Unsigned.ipa
