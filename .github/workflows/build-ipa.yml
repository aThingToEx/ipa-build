name: Build Unsigned IPA for Sideloadly
on:
  workflow_dispatch: # Allows manual trigger via the Actions tab

jobs:
  build:
    name: Build Web App and Package Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies and Build Web Assets
        run: |
          npm install
          npm run build 

      - name: Initialize Capacitor iOS Container
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "PuzzleForge Hub" "com.sideload.puzzleforge" --web-dir=dist
          npx cap add ios
          npx cap sync ios

      - name: Compile Native App Bundle (Unsigned)
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO

      - name: Package App into IPA Container
        run: |
          # Locate compiled .app folder inside Xcode build directories
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "App.app" -type d | head -n 1)
          
          # Structure the traditional Payload folder required by Sideloadly
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          
          # Compress into an .ipa file
          zip -r PuzzleForge_Unsigned.ipa Payload
          
      - name: Upload Finished File to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: PuzzleForge-Sideloadly-Ready
          path: PuzzleForge_Unsigned.ipa
